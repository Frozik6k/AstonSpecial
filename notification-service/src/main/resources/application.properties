spring.application.name=notification-service
spring.kafka.consumer.group-id=group_id
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.Frozik6k.model.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=ru.Frozik6k.model.kafka.UserEvent
server.port=8082
spring.mail.host=smtp.mail.ru
spring.mail.port=1025
spring.mail.username=name
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail=example@mail.ru
app.site=example.ru
app.kafka.topics.user-events=user.events
spring.config.import=classpath:messages-mail.yml