version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: postgres
    networks:
      - app-network
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    networks:
      - app-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    depends_on:
      - postgres

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      app-network:
        aliases:
          - kafka

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    networks:
      - app-network
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: discovery-service
      CONFIG_SERVER_URL: http://config-service:8888

  config-service:
    build: ./config-service
    container_name: config-service
    networks:
      - app-network
    ports:
      - "8888:8888"
    environment:
      SPRING_APPLICATION_NAME: config-service
      EUREKA_SERVER_HOST: discovery-service
      EUREKA_SERVER_PORT: 8761
    depends_on:
        - discovery-service
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1" ]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 20s

  user-service:
    build: ./user-service
    container_name: user-service
    networks:
      - app-network
    ports:
      - "8081:8081"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_SERVER_HOST: discovery-service
      EUREKA_SERVER_PORT: 8761
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 20s

  notification-service:
    build: ./notification-service
    container_name: notification-service
    networks:
      - app-network
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_SERVER_HOST: discovery-service
      EUREKA_SERVER_PORT: 8761
    depends_on:
      kafka:
        condition: service_started
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 20s

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    networks:
      - app-network
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_SERVER_HOST: discovery-service
      EUREKA_SERVER_PORT: 8761
    depends_on:
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports: ["8025:8025", "1025:1025"]  # UI и SMTP
    networks:
      - app-network

networks:
  app-network:
    driver: bridge